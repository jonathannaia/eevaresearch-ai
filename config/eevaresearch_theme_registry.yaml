classification_output_contract:
  required_fields:
    - item_id
    - source_type
    - source_url
    - issuer_name
    - ticker_or_local_identifier
    - published_at
    - assigned_theme_ids
    - matched_aliases
    - matched_event_patterns
    - evidence_excerpt
    - original_language
    - confidence
