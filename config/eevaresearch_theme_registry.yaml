# EevaResearch canonical theme registry
# Purpose: machine-readable taxonomy for classifying, prioritizing, and later
# discovering filings, earnings releases, IR materials, and news.
# This registry supplies relevance context only. It must not publish signals or
# bypass the CandidateSignal human-review lifecycle.
#
# Normalization guidance:
# - Match aliases case-insensitively after Unicode normalization.
# - Use aliases as retrieval/classification hints, not proof of relevance.
# - Require source evidence and a material event before creating a candidate.
# - Terms are intentionally multilingual where useful; preserve original source
#   language and provide English translation in downstream research output.

registry_version: 1
registry_name: EevaResearch Theme Registry
primary_language: en

matching_policy:
  minimum_theme_evidence: 1
  require_material_event_for_candidate: true
  allow_multi_theme_assignment: true
  do_not_auto_publish: true
  source_priority:
    - regulatory_filing
    - issuer_ir
    - earnings_release
    - official_company_statement
    - reputable_news
  common_material_event_patterns:
    - earnings
    - guidance_change
    - capex
    - capacity_expansion
    - customer_win
    - order_or_backlog
    - supply_agreement
    - partnership
    - product_launch
    - technology_milestone
    - financing
    - m_and_a
    - restructuring
    - executive_change
    - litigation_or_regulatory
    - export_control_or_trade_policy

