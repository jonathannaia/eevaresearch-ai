[theme]
# Redesign v2 (design/redesign-v2): same theme keys, values re-mapped
# to the v2 palette that assets/styles.css's :root now carries — see that
# file's header for the reconciliation. secondaryBackgroundColor = the
# --surface-hover step; borders = --border (card); code = --surface-input.
#
# Midnight Teal institutional-research pass (visual-hierarchy-and-token
# pass only — no navigation/data/feature/architecture change) — a full
# replacement of the prior application-shell dark/indigo palette, not an
# additive layer. Same theme keys as before, values re-mapped to a
# midnight-teal-slate palette with one consistent teal accent.
# secondaryBackgroundColor drives most native widget chrome (text
# inputs, selectboxes, dataframe headers) — mapped to assets/styles.css's
# --surface-hover token (the "input/table surface" tone one step up from
# page background), distinct from card surfaces (--surface, handled by
# assets/styles.css via custom-classed containers). borderColor/
# dataframeBorderColor use assets/styles.css's --border value (#263137)
# — deliberately quiet, not held to the old 3:1 non-text-contrast floor
# (see that token's own :root comment): "reduce excessive card-border
# visibility" is the explicit direction for this pass, applied
# consistently to native-widget borders too, not just custom cards.
base = "dark"

primaryColor = "#6FD3BC"
backgroundColor = "#0B0C0E"
secondaryBackgroundColor = "#171A1E"
textColor = "#E8EAEC"

linkColor = "#7DD8C2"
linkUnderline = false

borderColor = "#22252A"
dataframeBorderColor = "#22252A"
dataframeHeaderBackgroundColor = "#121417"

codeTextColor = "#E8EAEC"
codeBackgroundColor = "#0F1113"

font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"

baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

showWidgetBorder = true
showSidebarBorder = false

[server]
headless = true

[browser]
gatherUsageStats = false
