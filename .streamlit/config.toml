[theme]
# Application-shell dark/dim pass (Perplexity-inspired sidebar layout,
# narrowly scoped) — a full replacement of the prior light-editorial
# palette (indigo/editorial-white, feat/ui-redesign-live), not an
# additive layer. Same theme keys as before, values re-mapped to a near-
# black/slate palette with one consistent indigo accent (kept from the
# prior pass, re-tuned lighter — indigo-400 #818CF8 rather than indigo-600
# #4F46E5 — since the darker shade reads as muddy/low-contrast against a
# near-black surface; the darker shade is kept only for solid-fill CTA
# buttons, where it sits under white label text, not as text/icon color
# itself). secondaryBackgroundColor drives most native widget chrome
# (text inputs, selectboxes, dataframe headers) — mapped to the "input/
# table surface" tone, distinct from card surfaces (which assets/
# styles.css handles via its own --surface token on custom-classed
# containers). borderColor/dataframeBorderColor use assets/styles.css's
# --hairline-2 value: #6B7280, chosen (see that token's own comment) as
# the lightest neutral slate that still clears the 3:1 AA non-text-
# contrast minimum against every one of this palette's four backgrounds,
# including the lightest (--surface-2, 3.38:1 — the binding constraint).
base = "dark"

primaryColor = "#818CF8"
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#1D2026"
textColor = "#F5F6F7"

linkColor = "#818CF8"
linkUnderline = false

borderColor = "#6B7280"
dataframeBorderColor = "#6B7280"
dataframeHeaderBackgroundColor = "#16181D"

codeTextColor = "#F5F6F7"
codeBackgroundColor = "#16181D"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

showWidgetBorder = true
showSidebarBorder = false

[server]
headless = true

[browser]
gatherUsageStats = false
