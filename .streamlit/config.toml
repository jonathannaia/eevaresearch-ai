[theme]
# Native Streamlit widget theme. Colors are a generated mirror of
# src/ui/theme_tokens.py (the single source of truth) and are
# parity-checked by tests/test_theme_tokens.py; edit the tokens there,
# never a color here. Keys in this [theme] section are shared by both
# [theme.dark] and [theme.light] (Streamlit merges them, the per-theme
# section wins). With both sections present Streamlit offers
# System / Light / Dark natively and defaults to System, and each section's
# backgroundColor equals that theme's --bg so the canvas Streamlit paints
# before the app's own CSS arrives is already the right color.
# Fonts: Streamlit accepts one family per source URL and uses the name
# verbatim as the start of a font-family list, so the KR/JP families are
# named here as fallbacks and loaded by assets/styles.css's @import.
font = "IBM Plex Sans, IBM Plex Sans KR, IBM Plex Sans JP:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "IBM Plex Sans, IBM Plex Sans KR, IBM Plex Sans JP:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"

baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

linkUnderline = false
showWidgetBorder = true
showSidebarBorder = false

[theme.dark]
primaryColor = "#8AA8E0"
backgroundColor = "#111110"
secondaryBackgroundColor = "#22211E"
textColor = "#ECE9E4"
linkColor = "#9DB6EA"
borderColor = "#2A2825"
dataframeBorderColor = "#2A2825"
dataframeHeaderBackgroundColor = "#1A1917"
codeTextColor = "#ECE9E4"
codeBackgroundColor = "#161513"

[theme.dark.sidebar]
backgroundColor = "#141412"

[theme.light]
primaryColor = "#23386E"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#F0EDE6"
textColor = "#1C1B19"
linkColor = "#2F4F9E"
borderColor = "#E2DED5"
dataframeBorderColor = "#E2DED5"
dataframeHeaderBackgroundColor = "#FCFBF8"
codeTextColor = "#1C1B19"
codeBackgroundColor = "#FFFFFF"

[theme.light.sidebar]
backgroundColor = "#EFECE5"

[server]
headless = true

[browser]
gatherUsageStats = false
