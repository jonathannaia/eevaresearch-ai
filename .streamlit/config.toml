[theme]
# Midnight-navy visual-theme redesign (design/DECISIONS.md) — same theme
# keys as before, values re-mapped from the previous neutral-gray palette.
# secondaryBackgroundColor drives most native widget chrome (text inputs,
# selectboxes, dataframe headers) — mapped to the "input/table surface"
# tone, distinct from card surfaces (which assets/styles.css handles via
# its own --surface token on custom-classed containers). borderColor/
# dataframeBorderColor use the stronger of the two divider tones
# (assets/styles.css's --hairline-2) rather than the softer decorative one,
# since these are functional widget/table boundaries and are kept ≥3:1
# against every background in the palette (AA non-text-contrast minimum).
base = "dark"

primaryColor = "#60A5FA"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#0D1A2D"
textColor = "#F1F5F9"

linkColor = "#F1F5F9"
linkUnderline = false

borderColor = "#5578A0"
dataframeBorderColor = "#5578A0"
dataframeHeaderBackgroundColor = "#0D1A2D"

codeTextColor = "#F1F5F9"
codeBackgroundColor = "#0D1A2D"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

showWidgetBorder = true
showSidebarBorder = false

[server]
headless = true

[browser]
gatherUsageStats = false
