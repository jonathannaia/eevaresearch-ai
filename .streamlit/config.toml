[theme]
# Native Streamlit widget theme. Colors are a generated mirror of
# src/ui/theme_tokens.py (the single source of truth) and are
# parity-checked by tests/test_theme_tokens.py; edit the tokens there,
# never a color here. Keys in this [theme] section are shared by both
# [theme.dark] and [theme.light] (Streamlit merges them, the per-theme
# section wins). With both sections present Streamlit offers
# System / Light / Dark natively and defaults to System; the app drives
# that choice itself (src/ui/theme.py), and each section's
# backgroundColor equals that theme's --bg so the canvas Streamlit paints
# before the app's own CSS arrives is already the right color.
# Fonts: Streamlit accepts one family per source URL and uses the name
# verbatim as the start of a font-family list, so the KR/JP families are
# named here as fallbacks and loaded by assets/styles.css's @import.
font = "Inter, IBM Plex Sans KR, IBM Plex Sans JP:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter, IBM Plex Sans KR, IBM Plex Sans JP:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

linkUnderline = false
showWidgetBorder = true
showSidebarBorder = false

[theme.dark]
primaryColor = "#2DBFA8"
backgroundColor = "#0E1013"
secondaryBackgroundColor = "#1A1E25"
textColor = "#E7E9EC"
linkColor = "#6AA8F0"
borderColor = "#23272E"
dataframeBorderColor = "#23272E"
dataframeHeaderBackgroundColor = "#121418"
codeTextColor = "#E7E9EC"
codeBackgroundColor = "#0F1215"

[theme.dark.sidebar]
backgroundColor = "#0B0D10"

[theme.light]
primaryColor = "#00715B"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#E6EBF3"
textColor = "#222427"
linkColor = "#1C68B6"
borderColor = "#D3D7DF"
dataframeBorderColor = "#D3D7DF"
dataframeHeaderBackgroundColor = "#FBFDFF"
codeTextColor = "#222427"
codeBackgroundColor = "#FCFFFF"

[theme.light.sidebar]
backgroundColor = "#EEF0F4"

[server]
headless = true

[browser]
gatherUsageStats = false
