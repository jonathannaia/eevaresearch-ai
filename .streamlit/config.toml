[theme]
# Midnight Teal institutional-research pass (visual-hierarchy-and-token
# pass only — no navigation/data/feature/architecture change) — a full
# replacement of the prior application-shell dark/indigo palette, not an
# additive layer. Same theme keys as before, values re-mapped to a
# midnight-teal-slate palette with one consistent teal accent.
# secondaryBackgroundColor drives most native widget chrome (text
# inputs, selectboxes, dataframe headers) — mapped to assets/styles.css's
# --surface-hover token (the "input/table surface" tone one step up from
# page background), distinct from card surfaces (--surface, handled by
# assets/styles.css via custom-classed containers). borderColor/
# dataframeBorderColor use assets/styles.css's --border value (#263137)
# — deliberately quiet, not held to the old 3:1 non-text-contrast floor
# (see that token's own :root comment): "reduce excessive card-border
# visibility" is the explicit direction for this pass, applied
# consistently to native-widget borders too, not just custom cards.
base = "dark"

primaryColor = "#21B7A8"
backgroundColor = "#101417"
secondaryBackgroundColor = "#1D2529"
textColor = "#F1F4F2"

linkColor = "#21B7A8"
linkUnderline = false

borderColor = "#263137"
dataframeBorderColor = "#263137"
dataframeHeaderBackgroundColor = "#171D20"

codeTextColor = "#F1F4F2"
codeBackgroundColor = "#171D20"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

showWidgetBorder = true
showSidebarBorder = false

[server]
headless = true

[browser]
gatherUsageStats = false
