# Render startup template (Durable-State Phase 4M-4) — this is NOT the
# real secrets file and is safe to commit: every value below is a
# placeholder, substituted at container start time by
# scripts/render_generate_secrets.py from this Render Web Service's own
# environment variables. The generated result is written to
# .streamlit/secrets.toml, which stays git-ignored (see .gitignore) and
# is never committed.
#
# Streamlit Community Cloud's own deployment does not use this file at
# all — its Secrets editor writes .streamlit/secrets.toml directly, and
# nothing in that deployment runs scripts/render_start.sh. This template
# only matters for the separate Render Web Service.
#
# Corresponding Render environment variables (set these in Render's own
# dashboard — never by editing this file):
#   EDGE_AUTH_REDIRECT_URI            e.g. https://eevaresearch-ai.onrender.com/oauth2callback
#   EDGE_AUTH_COOKIE_SECRET           a long, random, private string generated for this deployment
#                                     (not the Google OAuth client secret — a separate value
#                                     Streamlit itself uses to sign its own session cookie)
#   EDGE_GOOGLE_CLIENT_ID             from Google Cloud Console -> OAuth 2.0 Client IDs
#   EDGE_GOOGLE_CLIENT_SECRET         from Google Cloud Console -> OAuth 2.0 Client IDs
#   EDGE_GOOGLE_SERVER_METADATA_URL   https://accounts.google.com/.well-known/openid-configuration
#                                     (Google's own standard, public OIDC discovery endpoint —
#                                     not a secret, but still supplied via environment variable
#                                     for consistency with everything else here)

[auth]
redirect_uri = "${EDGE_AUTH_REDIRECT_URI}"
cookie_secret = "${EDGE_AUTH_COOKIE_SECRET}"

[auth.google]
client_id = "${EDGE_GOOGLE_CLIENT_ID}"
client_secret = "${EDGE_GOOGLE_CLIENT_SECRET}"
server_metadata_url = "${EDGE_GOOGLE_SERVER_METADATA_URL}"
